name: Course RunPod read-only preflight
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: course-runpod-preflight
  cancel-in-progress: false
jobs:
  observe:
    if: github.repository == 'jasonjiang8866/MLsysZero2Hero' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.13.5'
          enable-cache: false
      - run: uv sync --locked --no-dev --python 3.12
      - name: Read catalog and inventory only
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: uv run --locked --no-dev mlsys-lab preflight --output out/preflight
      - name: Upload sanitized observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: course-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/preflight/
          if-no-files-found: error
          retention-days: 30
      - name: Summary
        if: always()
        run: test ! -f out/preflight/summary.md || cat out/preflight/summary.md >> "$GITHUB_STEP_SUMMARY"
